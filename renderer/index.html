<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'"
    />
    <title>Spidey Sense</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-view="badge">
    <div class="badge" id="badge" role="button" tabindex="0" aria-label="Open Spidey Sense" title="Click to open">
      <div class="badge__thread"></div>
      <div class="badge__body" id="bbody" data-level="calm"><canvas id="bcanvas" width="56" height="56"></canvas><i class="badge__alert" id="balert" hidden>0</i></div>
    </div>
    <div class="hang" id="hang">
      <div class="thread"><i></i></div>
      <main class="panel" id="panel" data-level="calm">
        <header class="banner">
          <span class="banner__a">SPIDEY</span><span class="banner__b">SENSE</span>
          <i class="led" id="led" title="Spider-sense status"></i>
          <button class="fold" id="lockerbtn" title="Suit locker (XP and suits)" aria-label="Suit locker">★</button>
          <button class="fold mail" id="inboxbtn" title="Notification inbox" aria-label="Notification inbox">✉<b id="icount" hidden>0</b></button>
          <button class="fold" id="collapse" title="Collapse to badge" aria-label="Collapse to badge">▲</button>
        </header>

        <aside class="slog" id="slog" hidden aria-label="Spider-sense log">
          <header><b>SENSE LOG</b><button id="sclear">CLEAR</button><button id="sclose" aria-label="Close log">✕</button></header>
          <ul id="sitems"></ul>
        </aside>

        <aside class="slog" id="inbox" hidden aria-label="Notification inbox">
          <header><b>INBOX</b><button id="iclear">CLEAR</button><button id="iclose" aria-label="Close inbox">✕</button></header>
          <ul id="iitems"></ul>
        </aside>

        <aside class="slog" id="bugle" hidden aria-label="The Daily Web">
          <header><b>THE DAILY WEB</b><button id="bsave">SAVE</button><button id="bcopy">COPY</button><button id="bclose" aria-label="Close">✕</button></header>
          <canvas id="bpaper" width="1080" height="1500"></canvas>
        </aside>

        <aside class="slog" id="edith" hidden aria-label="E.D.I.T.H. threat assessment">
          <header><b>E.D.I.T.H.</b><button id="erescan">RESCAN</button><button id="eclose" aria-label="Close">✕</button></header>
          <div class="eflag" id="eflag" data-level="green"><strong id="escore">–</strong><span id="elevel">SCANNING…</span></div>
          <ul id="echecks"></ul>
        </aside>

        <aside class="slog" id="locker" hidden aria-label="Suit locker">
          <header><b>SUIT LOCKER</b><button id="lclose" aria-label="Close">✕</button></header>
          <div class="xpbar"><strong id="lvl">LEVEL 1</strong><div class="bar"><i id="xpfill"></i></div><small id="xptext"></small></div>
          <ul id="suits"></ul>
        </aside>

        <canvas id="web" width="260" height="248" aria-label="System load drawn as a spider web"></canvas>

        <ul class="readout" id="readout" aria-label="Current readings">
          <li data-k="cpu"><b>CPU</b><span>–</span></li>
          <li data-k="ram"><b>RAM</b><span>–</span></li>
          <li data-k="disk"><b>DISK</b><span>–</span></li>
          <li data-k="bat"><b>BAT</b><span>–</span></li>
          <li data-k="net"><b>NET</b><span>–</span></li>
        </ul>

        <p class="caption" id="caption" role="status" aria-live="polite">ALL QUIET… FOR NOW.</p>

        <section class="remind" aria-label="Reminders">
          <input id="rin" type="text" maxlength="60" placeholder="ASK KAREN… cpu? · in 20m stretch" aria-label="Ask Karen or add a reminder" autocomplete="off" spellcheck="false" />
          <ul id="rlist"></ul>
        </section>

        <section class="timer" aria-label="Web timer">
          <button id="tmode" class="chip" title="Switch focus / break">FOCUS</button>
          <output id="tclock">25:00</output>
          <button id="tgo" class="round" title="Start / pause" aria-label="Start or pause">▶</button>
          <button id="treset" class="round" title="Reset" aria-label="Reset timer">↺</button>
        </section>
      </main>
    </div>
    <script src="spider.js"></script>
    <script src="suits.js"></script>
    <script src="daystats.js"></script>
    <script src="app.js"></script>
    <script src="reminders.js"></script>
    <script src="karen.js"></script>
    <script src="guardian.js"></script>
    <script src="inbox.js"></script>
    <script src="bugle.js"></script>
    <script src="bugle-ui.js"></script>
    <script src="edith-ui.js"></script>
    <script src="locker-ui.js"></script>
  </body>
</html>
